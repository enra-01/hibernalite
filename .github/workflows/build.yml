        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/util/MemoryHelper.kt
        package com.hibernalite.app.util

        import android.app.ActivityManager
        import android.content.Context
        import android.content.SharedPreferences
        import android.content.pm.ApplicationInfo
        import android.content.pm.PackageManager
        import com.hibernalite.app.model.AppInfo
        import java.util.Locale

        object MemoryHelper {
            private const val PREFS_NAME = "hibernalite_prefs"
            private const val KEY_EXCLUDED_PACKAGES = "key_excluded_packages"

            data class RamStatus(
                val totalBytes: Long,
                val availableBytes: Long,
                val usedBytes: Long,
                val usedPercentage: Int
            )

            private fun getPrefs(context: Context): SharedPreferences {
                return context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            }

            fun getExcludedPackages(context: Context): Set<String> {
                val prefs = getPrefs(context)
                return prefs.getStringSet(KEY_EXCLUDED_PACKAGES, emptySet()) ?: emptySet()
            }

            fun setPackageExcluded(context: Context, packageName: String, isExcluded: Boolean) {
                val prefs = getPrefs(context)
                val currentSet = prefs.getStringSet(KEY_EXCLUDED_PACKAGES, emptySet())?.toMutableSet() ?: mutableSetOf()
                if (isExcluded) {
                    currentSet.add(packageName)
                } else {
                    currentSet.remove(packageName)
                }
                prefs.edit().putStringSet(KEY_EXCLUDED_PACKAGES, currentSet).apply()
            }

            fun getRamStatus(context: Context): RamStatus {
                val actManager = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                val memInfo = ActivityManager.MemoryInfo()
                actManager.getMemoryInfo(memInfo)
                val total = memInfo.totalMem
                val available = memInfo.availMem
                val used = total - available
                val percentage = if (total > 0) ((used * 100) / total).toInt() else 0
                return RamStatus(total, available, used, percentage.coerceIn(0, 100))
            }

            fun formatBytes(bytes: Long): String {
                val gb = bytes / (1024.0 * 1024.0 * 1024.0)
                val mb = bytes / (1024.0 * 1024.0)
                return if (gb >= 1.0) String.format(Locale.getDefault(), "%.2f GB", gb)
                else String.format(Locale.getDefault(), "%.0f MB", mb)
            }

            fun getInstalledUserApps(context: Context): List<AppInfo> {
                val pm = context.packageManager
                val selfPackage = context.packageName
                val excludedPackages = getExcludedPackages(context)
                val systemExclusions = setOf("android", "com.android.systemui", "com.android.settings", "com.android.phone", "com.google.android.gms", "com.google.android.gsf")

                val installedPackages = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                val appList = mutableListOf<AppInfo>()

                for (app in installedPackages) {
                    val pkg = app.packageName
                    if (pkg == selfPackage || systemExclusions.contains(pkg)) continue
                    val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                    val isUpdatedSystem = (app.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0
                    if (!isSystem || isUpdatedSystem) {
                        val label = pm.getApplicationLabel(app).toString()
                        val icon = try { pm.getApplicationIcon(app) } catch (e: Exception) { null }
                        val isSelected = !excludedPackages.contains(pkg)
                        appList.add(AppInfo(label, pkg, icon, isSelected, isSystem))
                    }
                }
                return appList.sortedBy { it.appName.lowercase(Locale.getDefault()) }
            }

            fun cleanBackgroundMemory(context: Context, packages: List<String>): Long {
                val beforeStatus = getRamStatus(context)
                val actManager = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                for (pkg in packages) {
                    try { actManager.killBackgroundProcesses(pkg) } catch (e: Exception) {}
                }
                System.gc()
                Runtime.getRuntime().gc()
                val afterStatus = getRamStatus(context)
                val freed = afterStatus.availableBytes - beforeStatus.availableBytes
                return if (freed > 0) freed else 0L
            }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/adapter/AppListAdapter.kt
        package com.hibernalite.app.adapter

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.material.checkbox.MaterialCheckBox
        import com.hibernalite.app.R
        import com.hibernalite.app.model.AppInfo
        import com.hibernalite.app.util.MemoryHelper

        class AppListAdapter(
            private var apps: List<AppInfo>,
            private val onSelectionChanged: (selectedCount: Int) -> Unit
        ) : RecyclerView.Adapter<AppListAdapter.AppViewHolder>() {

            class AppViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                val ivIcon: ImageView = itemView.findViewById(R.id.ivAppIcon)
                val tvName: TextView = itemView.findViewById(R.id.tvAppName)
                val tvPkg: TextView = itemView.findViewById(R.id.tvPackageName)
                val cbHibernate: MaterialCheckBox = itemView.findViewById(R.id.cbHibernate)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): AppViewHolder {
                val view = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                return AppViewHolder(view)
            }

            override fun onBindViewHolder(holder: AppViewHolder, position: Int) {
                val app = apps[position]
                holder.tvName.text = app.appName
                holder.tvPkg.text = app.packageName
                if (app.icon != null) holder.ivIcon.setImageDrawable(app.icon)
                else holder.ivIcon.setImageResource(R.drawable.ic_launcher_foreground)

                holder.cbHibernate.setOnCheckedChangeListener(null)
                holder.cbHibernate.isChecked = app.isSelected

                holder.cbHibernate.setOnCheckedChangeListener { view, isChecked ->
                    app.isSelected = isChecked
                    MemoryHelper.setPackageExcluded(view.context, app.packageName, !isChecked)
                    onSelectionChanged(getSelectedApps().size)
                }

                holder.itemView.setOnClickListener {
                    holder.cbHibernate.isChecked = !holder.cbHibernate.isChecked
                }
            }

            override fun getItemCount(): Int = apps.size

            fun updateData(newApps: List<AppInfo>) {
                this.apps = newApps
                notifyDataSetChanged()
                onSelectionChanged(getSelectedApps().size)
            }

            fun getSelectedApps(): List<AppInfo> = apps.filter { it.isSelected }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/widget/RamCleanerWidgetProvider.kt
        package com.hibernalite.app.widget

        import android.app.PendingIntent
        import android.appwidget.AppWidgetManager
        import android.appwidget.AppWidgetProvider
        import android.content.ComponentName
        import android.content.Context
        import android.content.Intent
        import android.graphics.Bitmap
        import android.graphics.Canvas
        import android.graphics.Color
        import android.graphics.Paint
        import android.graphics.RectF
        import android.graphics.Typeface
        import android.os.Build
        import android.widget.RemoteViews
        import android.widget.Toast
        import com.hibernalite.app.R
        import com.hibernalite.app.util.MemoryHelper

        class RamCleanerWidgetProvider : AppWidgetProvider() {

            companion object {
                const val ACTION_TRIGGER_CLEAN = "com.hibernalite.app.ACTION_TRIGGER_CLEAN"

                fun updateWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                    val views = RemoteViews(context.packageName, R.layout.widget_ram_cleaner)
                    val ramStatus = MemoryHelper.getRamStatus(context)
                    views.setImageViewBitmap(R.id.ivWidgetGauge, createMiuGaugeBitmap(ramStatus.usedPercentage))

                    val intent = Intent(context, RamCleanerWidgetProvider::class.java).apply {
                        action = ACTION_TRIGGER_CLEAN
                    }
                    val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                    } else {
                        PendingIntent.FLAG_UPDATE_CURRENT
                    }
                    views.setOnClickPendingIntent(R.id.widgetRoot, PendingIntent.getBroadcast(context, 0, intent, flags))
                    appWidgetManager.updateAppWidget(appWidgetId, views)
                }

                private fun createMiuGaugeBitmap(percentage: Int): Bitmap {
                    val size = 200
                    val bitmap = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                    val canvas = Canvas(bitmap)
                    val strokeWidth = 14f
                    val padding = 16f
                    val rect = RectF(padding, padding, size - padding, size - padding)

                    val bgCirclePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.FILL
                        color = Color.argb(190, 15, 23, 42)
                    }
                    canvas.drawCircle(size / 2f, size / 2f, (size / 2f) - 4f, bgCirclePaint)

                    val trackPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.STROKE
                        this.strokeWidth = strokeWidth
                        color = Color.argb(60, 255, 255, 255)
                    }
                    canvas.drawArc(rect, 0f, 360f, false, trackPaint)

                    val ringColor = when {
                        percentage >= 85 -> Color.parseColor("#EF4444")
                        percentage >= 70 -> Color.parseColor("#F59E0B")
                        else -> Color.parseColor("#10B981")
                    }

                    val progressPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.STROKE
                        this.strokeWidth = strokeWidth
                        strokeCap = Paint.Cap.ROUND
                        color = ringColor
                    }

                    val sweepAngle = 360f * (percentage.coerceIn(1, 100) / 100f)
                    canvas.drawArc(rect, -90f, sweepAngle, false, progressPaint)

                    val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        color = Color.WHITE
                        textSize = 42f
                        typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                        textAlign = Paint.Align.CENTER
                    }
                    canvas.drawText("$percentage%", size / 2f, (size / 2f) + 4f, textPaint)

                    val subtextPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        color = ringColor
                        textSize = 20f
                        typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                        textAlign = Paint.Align.CENTER
                    }
                    canvas.drawText("RAM", size / 2f, (size / 2f) + 32f, subtextPaint)

                    return bitmap
                }
            }

            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                for (appWidgetId in appWidgetIds) {
                    updateWidget(context, appWidgetManager, appWidgetId)
                }
            }

            override fun onReceive(context: Context, intent: Intent) {
                super.onReceive(context, intent)
                if (intent.action == ACTION_TRIGGER_CLEAN) {
                    val userApps = MemoryHelper.getInstalledUserApps(context)
                    val targetPackages = userApps.filter { it.isSelected }.map { it.packageName }
                    if (targetPackages.isNotEmpty()) {
                        val freedBytes = MemoryHelper.cleanBackgroundMemory(context, targetPackages)
                        val freedStr = if (freedBytes > 0) MemoryHelper.formatBytes(freedBytes) else "Cache"
                        Toast.makeText(context, context.getString(R.string.widget_cleaned_format, freedStr, targetPackages.size), Toast.LENGTH_SHORT).show()
                    }
                    val manager = AppWidgetManager.getInstance(context)
                    val ids = manager.getAppWidgetIds(ComponentName(context, RamCleanerWidgetProvider::class.java))
                    for (id in ids) {
                        updateWidget(context, manager, id)
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/MainActivity.kt
        package com.hibernalite.app

        import android.appwidget.AppWidgetManager
        import android.content.ComponentName
        import android.content.res.ColorStateList
        import android.os.Bundle
        import android.view.View
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import androidx.lifecycle.lifecycleScope
        import androidx.recyclerview.widget.LinearLayoutManager
        import com.hibernalite.app.adapter.AppListAdapter
        import com.hibernalite.app.databinding.ActivityMainBinding
        import com.hibernalite.app.model.AppInfo
        import com.hibernalite.app.util.MemoryHelper
        import com.hibernalite.app.widget.RamCleanerWidgetProvider
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.withContext

        class MainActivity : AppCompatActivity() {

            private lateinit var binding: ActivityMainBinding
            private lateinit var appAdapter: AppListAdapter
            private var appsList: List<AppInfo> = emptyList()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                binding = ActivityMainBinding.inflate(layoutInflater)
                setContentView(binding.root)

                setupRecyclerView()
                setupListeners()
                refreshRamInfo()
                loadApps()
            }

            override fun onResume() {
                super.onResume()
                refreshRamInfo()
            }

            private fun setupRecyclerView() {
                appAdapter = AppListAdapter(emptyList()) { count ->
                    updateSelectedAppsCount(count)
                    updateWidgets()
                }
                binding.rvApps.apply {
                    layoutManager = LinearLayoutManager(this@MainActivity)
                    adapter = appAdapter
                    isNestedScrollingEnabled = false
                }
            }

            private fun setupListeners() {
                binding.btnRefresh.setOnClickListener {
                    refreshRamInfo()
                    loadApps()
                }

                binding.btnHibernateAll.setOnClickListener {
                    performPureBackgroundBoost()
                }

                binding.btnQuickClean.setOnClickListener {
                    performPureBackgroundBoost()
                }
            }

            private fun refreshRamInfo() {
                val status = MemoryHelper.getRamStatus(this)
                binding.tvRamPercent.text = "${status.usedPercentage}%"
                binding.progressBarRam.progress = status.usedPercentage

                val usedStr = MemoryHelper.formatBytes(status.usedBytes)
                val totalStr = MemoryHelper.formatBytes(status.totalBytes)
                val availStr = MemoryHelper.formatBytes(status.availableBytes)

                binding.tvRamDetails.text = getString(R.string.ram_details_format, usedStr, totalStr, availStr)

                val colorRes = when {
                    status.usedPercentage >= 85 -> R.color.ram_red
                    status.usedPercentage >= 70 -> R.color.ram_orange
                    else -> R.color.ram_green
                }
                val color = ContextCompat.getColor(this, colorRes)
                binding.tvRamPercent.setTextColor(color)
                binding.progressBarRam.progressTintList = ColorStateList.valueOf(color)
            }

            private fun loadApps() {
                lifecycleScope.launch {
                    binding.tvEmptyState.visibility = View.GONE
                    val apps = withContext(Dispatchers.IO) {
                        MemoryHelper.getInstalledUserApps(this@MainActivity)
                    }
                    appsList = apps
                    appAdapter.updateData(apps)
                    if (apps.isEmpty()) {
                        binding.tvEmptyState.visibility = View.VISIBLE
                    }
                }
            }

            private fun updateSelectedAppsCount(count: Int) {
                binding.tvAppsCount.text = getString(R.string.apps_count_format, count)
                binding.btnHibernateAll.isEnabled = count > 0
                binding.btnQuickClean.isEnabled = count > 0
            }

            private fun performPureBackgroundBoost() {
                val selectedPackages = appAdapter.getSelectedApps().map { it.packageName }
                if (selectedPackages.isEmpty()) {
                    Toast.makeText(this, "Pilih setidaknya 1 aplikasi untuk dibersihkan", Toast.LENGTH_SHORT).show()
                    return
                }

                lifecycleScope.launch {
                    val freedBytes = withContext(Dispatchers.IO) {
                        MemoryHelper.cleanBackgroundMemory(this@MainActivity, selectedPackages)
                    }
                    val freedStr = if (freedBytes > 0) MemoryHelper.formatBytes(freedBytes) else "Cache"
                    Toast.makeText(this@MainActivity, getString(R.string.toast_quick_clean_done, freedStr, selectedPackages.size), Toast.LENGTH_SHORT).show()
                    refreshRamInfo()
                    updateWidgets()
                }
            }

            private fun updateWidgets() {
                val manager = AppWidgetManager.getInstance(this)
                val ids = manager.getAppWidgetIds(ComponentName(this, RamCleanerWidgetProvider::class.java))
                for (id in ids) {
                    RamCleanerWidgetProvider.updateWidget(this, manager, id)
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build Debug APK
      working-directory: ./hibernalite
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HibernaLite-APK
        path: hibernalite/app/build/outputs/apk/debug/*.apk

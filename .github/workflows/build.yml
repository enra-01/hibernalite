name: Build HibernaLite APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Apply HibernaLite v1.1.0 Updates (Memory, Widget, Speed)
      run: |
        mkdir -p hibernalite/app/src/main/java/com/hibernalite/app/widget
        mkdir -p hibernalite/app/src/main/res/xml
        mkdir -p hibernalite/app/src/main/res/values-in

        cat << 'EOF' > hibernalite/settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "HibernaLite"
        include(":app")
        EOF

        cat << 'EOF' > hibernalite/app/src/main/AndroidManifest.xml

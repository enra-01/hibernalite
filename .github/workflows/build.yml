        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/util/MemoryHelper.kt
        package com.hibernalite.app.util

        import android.app.ActivityManager
        import android.content.Context
        import android.content.SharedPreferences
        import android.content.pm.ApplicationInfo
        import android.content.pm.PackageManager
        import com.hibernalite.app.model.AppInfo
        import java.util.Locale

        object MemoryHelper {
            private const val PREFS_NAME = "hibernalite_prefs"
            private const val KEY_EXCLUDED_PACKAGES = "key_excluded_packages"

            data class RamStatus(
                val totalBytes: Long,
                val availableBytes: Long,
                val usedBytes: Long,
                val usedPercentage: Int
            )

            private fun getPrefs(context: Context): SharedPreferences {
                return context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            }

            fun getExcludedPackages(context: Context): Set<String> {
                val prefs = getPrefs(context)
                return prefs.getStringSet(KEY_EXCLUDED_PACKAGES, emptySet()) ?: emptySet()
            }

            fun setPackageExcluded(context: Context, packageName: String, isExcluded: Boolean) {
                val prefs = getPrefs(context)
                val currentSet = prefs.getStringSet(KEY_EXCLUDED_PACKAGES, emptySet())?.toMutableSet() ?: mutableSetOf()
                if (isExcluded) {
                    currentSet.add(packageName)
                } else {
                    currentSet.remove(packageName)
                }
                prefs.edit().putStringSet(KEY_EXCLUDED_PACKAGES, currentSet).apply()
            }

            fun getRamStatus(context: Context): RamStatus {
                val actManager = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                val memInfo = ActivityManager.MemoryInfo()
                actManager.getMemoryInfo(memInfo)

                val total = memInfo.totalMem
                val available = memInfo.availMem
                val used = total - available
                val percentage = if (total > 0) ((used * 100) / total).toInt() else 0

                return RamStatus(
                    totalBytes = total,
                    availableBytes = available,
                    usedBytes = used,
                    usedPercentage = percentage.coerceIn(0, 100)
                )
            }

            fun formatBytes(bytes: Long): String {
                val mb = bytes / (1024.0 * 1024.0)
                val gb = bytes / (1024.0 * 1024.0 * 1024.0)

                return if (gb >= 1.0) {
                    String.format(Locale.getDefault(), "%.2f GB", gb)
                } else {
                    String.format(Locale.getDefault(), "%.0f MB", mb)
                }
            }

            fun getInstalledUserApps(context: Context): List<AppInfo> {
                val pm = context.packageManager
                val selfPackage = context.packageName
                val excludedPackages = getExcludedPackages(context)

                val systemExclusions = setOf(
                    "android",
                    "com.android.systemui",
                    "com.android.settings",
                    "com.android.phone",
                    "com.google.android.gms",
                    "com.google.android.gsf",
                    "com.google.android.inputmethod.latin",
                    "com.android.inputmethod.latin",
                    "com.realme.launcher",
                    "com.coloros.launcher",
                    "com.oppo.launcher"
                )

                val installedPackages = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                val appList = mutableListOf<AppInfo>()

                for (app in installedPackages) {
                    val pkg = app.packageName
                    if (pkg == selfPackage || systemExclusions.contains(pkg)) {
                        continue
                    }

                    val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                    val isUpdatedSystem = (app.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0

                    if (!isSystem || isUpdatedSystem) {
                        val label = pm.getApplicationLabel(app).toString()
                        val icon = try {
                            pm.getApplicationIcon(app)
                        } catch (e: Exception) {
                            null
                        }

                        val isSelected = !excludedPackages.contains(pkg)

                        appList.add(
                            AppInfo(
                                appName = label,
                                packageName = pkg,
                                icon = icon,
                                isSelected = isSelected,
                                isSystemApp = isSystem
                            )
                        )
                    }
                }

                return appList.sortedBy { it.appName.lowercase(Locale.getDefault()) }
            }

            fun quickClean(context: Context, packages: List<String>): Long {
                val beforeStatus = getRamStatus(context)
                val actManager = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                for (pkg in packages) {
                    try {
                        actManager.killBackgroundProcesses(pkg)
                    } catch (e: Exception) {
                    }
                }
                val afterStatus = getRamStatus(context)
                val freed = afterStatus.availableBytes - beforeStatus.availableBytes
                return if (freed > 0) freed else 0L
            }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/adapter/AppListAdapter.kt
        package com.hibernalite.app.adapter

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.ImageView
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.material.checkbox.MaterialCheckBox
        import com.hibernalite.app.R
        import com.hibernalite.app.model.AppInfo
        import com.hibernalite.app.util.MemoryHelper

        class AppListAdapter(
            private var apps: List<AppInfo>,
            private val onSelectionChanged: (selectedCount: Int) -> Unit
        ) : RecyclerView.Adapter<AppListAdapter.AppViewHolder>() {

            class AppViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
                val ivIcon: ImageView = itemView.findViewById(R.id.ivAppIcon)
                val tvName: TextView = itemView.findViewById(R.id.tvAppName)
                val tvPkg: TextView = itemView.findViewById(R.id.tvPackageName)
                val cbHibernate: MaterialCheckBox = itemView.findViewById(R.id.cbHibernate)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): AppViewHolder {
                val view = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                return AppViewHolder(view)
            }

            override fun onBindViewHolder(holder: AppViewHolder, position: Int) {
                val app = apps[position]
                holder.tvName.text = app.appName
                holder.tvPkg.text = app.packageName

                if (app.icon != null) {
                    holder.ivIcon.setImageDrawable(app.icon)
                } else {
                    holder.ivIcon.setImageResource(R.drawable.ic_launcher_foreground)
                }

                holder.cbHibernate.setOnCheckedChangeListener(null)
                holder.cbHibernate.isChecked = app.isSelected

                holder.cbHibernate.setOnCheckedChangeListener { view, isChecked ->
                    app.isSelected = isChecked
                    MemoryHelper.setPackageExcluded(view.context, app.packageName, !isChecked)
                    onSelectionChanged(getSelectedApps().size)
                }

                holder.itemView.setOnClickListener {
                    holder.cbHibernate.isChecked = !holder.cbHibernate.isChecked
                }
            }

            override fun getItemCount(): Int = apps.size

            fun updateData(newApps: List<AppInfo>) {
                this.apps = newApps
                notifyDataSetChanged()
                onSelectionChanged(getSelectedApps().size)
            }

            fun getSelectedApps(): List<AppInfo> {
                return apps.filter { it.isSelected }
            }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/service/HibernationAccessibilityService.kt
        package com.hibernalite.app.service

        import android.accessibilityservice.AccessibilityService
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.os.Handler
        import android.os.Looper
        import android.provider.Settings
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityNodeInfo
        import android.widget.Toast
        import com.hibernalite.app.R
        import java.util.LinkedList
        import java.util.Queue

        class HibernationAccessibilityService : AccessibilityService() {

            companion object {
                var isRunning: Boolean = false
                    private set

                private val hibernationQueue: Queue<String> = LinkedList()
                private var currentProcessingPackage: String? = null
                private var isServiceActive = false

                fun isAccessibilityEnabled(context: Context): Boolean {
                    return isServiceActive
                }

                fun startHibernation(context: Context, packages: List<String>) {
                    hibernationQueue.clear()
                    hibernationQueue.addAll(packages)
                    isRunning = true

                    processNextApp(context)
                }

                private fun processNextApp(context: Context) {
                    if (hibernationQueue.isEmpty()) {
                        isRunning = false
                        currentProcessingPackage = null
                        Toast.makeText(context, R.string.toast_hibernation_complete, Toast.LENGTH_SHORT).show()

                        val launchIntent = context.packageManager.getLaunchIntentForPackage(context.packageName)
                        launchIntent?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                        context.startActivity(launchIntent)
                        return
                    }

                    val pkg = hibernationQueue.poll()
                    currentProcessingPackage = pkg

                    try {
                        val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                            data = Uri.parse("package:$pkg")
                            addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                        }
                        context.startActivity(intent)
                    } catch (e: Exception) {
                        processNextApp(context)
                    }
                }
            }

            private val mainHandler = Handler(Looper.getMainLooper())
            private var isActionPending = false

            override fun onServiceConnected() {
                super.onServiceConnected()
                isServiceActive = true
            }

            override fun onDestroy() {
                super.onDestroy()
                isServiceActive = false
                isRunning = false
            }

            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                if (!isRunning || event == null) return

                val rootNode = rootInActiveWindow ?: return
                val currentPkg = currentProcessingPackage ?: return

                if (event.packageName?.toString() == "com.android.settings") {
                    handleSettingsScreen(rootNode, currentPkg)
                }
            }

            private fun handleSettingsScreen(rootNode: AccessibilityNodeInfo, currentPkg: String) {
                if (isActionPending) return

                val forceStopLabels = listOf("Force stop", "FORCE STOP", "Paksa berhenti", "Paksa Berhenti")
                var forceStopClicked = false

                for (label in forceStopLabels) {
                    val nodes = rootNode.findAccessibilityNodeInfosByText(label)
                    for (node in nodes) {
                        if (node.isEnabled) {
                            isActionPending = true
                            node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                            forceStopClicked = true

                            mainHandler.postDelayed({
                                confirmDialogAndProceed()
                            }, 80)
                            break
                        } else {
                            mainHandler.postDelayed({
                                skipToNextApp()
                            }, 60)
                            return
                        }
                    }
                    if (forceStopClicked) break
                }

                mainHandler.postDelayed({
                    if (isRunning && currentProcessingPackage == currentPkg && !forceStopClicked) {
                        skipToNextApp()
                    }
                }, 400)
            }

            private fun confirmDialogAndProceed() {
                val rootNode = rootInActiveWindow
                if (rootNode != null) {
                    val confirmLabels = listOf("OK", "Ok", "Oke", "Force stop", "Paksa berhenti")
                    for (label in confirmLabels) {
                        val nodes = rootNode.findAccessibilityNodeInfosByText(label)
                        for (node in nodes) {
                            if (node.isClickable && node.isEnabled) {
                                node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                break
                            }
                        }
                    }
                }

                mainHandler.postDelayed({
                    isActionPending = false
                    processNextApp(this)
                }, 60)
            }

            private fun skipToNextApp() {
                isActionPending = false
                processNextApp(this)
            }

            override fun onInterrupt() {
                isRunning = false
            }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/widget/RamCleanerWidgetProvider.kt
        package com.hibernalite.app.widget

        import android.app.PendingIntent
        import android.appwidget.AppWidgetManager
        import android.appwidget.AppWidgetProvider
        import android.content.ComponentName
        import android.content.Context
        import android.content.Intent
        import android.os.Build
        import android.widget.RemoteViews
        import android.widget.Toast
        import com.hibernalite.app.R
        import com.hibernalite.app.util.MemoryHelper

        class RamCleanerWidgetProvider : AppWidgetProvider() {

            companion object {
                const val ACTION_TRIGGER_CLEAN = "com.hibernalite.app.ACTION_TRIGGER_CLEAN"

                fun updateWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                    val views = RemoteViews(context.packageName, R.layout.widget_ram_cleaner)

                    val intent = Intent(context, RamCleanerWidgetProvider::class.java).apply {
                        action = ACTION_TRIGGER_CLEAN
                    }
                    val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                    } else {
                        PendingIntent.FLAG_UPDATE_CURRENT
                    }
                    val pendingIntent = PendingIntent.getBroadcast(context, 0, intent, flags)
                    views.setOnClickPendingIntent(R.id.widgetRoot, pendingIntent)

                    appWidgetManager.updateAppWidget(appWidgetId, views)
                }
            }

            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                for (appWidgetId in appWidgetIds) {
                    updateWidget(context, appWidgetManager, appWidgetId)
                }
            }

            override fun onReceive(context: Context, intent: Intent) {
                super.onReceive(context, intent)

                if (intent.action == ACTION_TRIGGER_CLEAN) {
                    val userApps = MemoryHelper.getInstalledUserApps(context)
                    val targetPackages = userApps.filter { it.isSelected }.map { it.packageName }

                    if (targetPackages.isNotEmpty()) {
                        val freedBytes = MemoryHelper.quickClean(context, targetPackages)
                        val freedStr = if (freedBytes > 0) MemoryHelper.formatBytes(freedBytes) else "Cache"

                        val message = context.getString(
                            R.string.widget_cleaned_format,
                            freedStr,
                            targetPackages.size
                        )
                        Toast.makeText(context, message, Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(context, "Tidak ada aplikasi untuk dihibernasi", Toast.LENGTH_SHORT).show()
                    }

                    val manager = AppWidgetManager.getInstance(context)
                    val ids = manager.getAppWidgetIds(ComponentName(context, RamCleanerWidgetProvider::class.java))
                    for (id in ids) {
                        updateWidget(context, manager, id)
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > hibernalite/app/src/main/java/com/hibernalite/app/MainActivity.kt
        package com.hibernalite.app

        import android.appwidget.AppWidgetManager
        import android.content.ComponentName
        import android.content.Context
        import android.content.Intent
        import android.content.res.ColorStateList
        import android.os.Bundle
        import android.provider.Settings
